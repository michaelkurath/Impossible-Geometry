name: Render and validate geometry

on:
  push:
    branches:
      - main
      - 'art/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The project currently has no package-lock.json. Versions are pinned in package.json.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify generated sources
        run: npm run check:art
      - name: Unit tests
        run: npm test
      - name: Render all OG and TRMNL X variants
        run: npm run render
      - name: Verify complete screenshot matrix
        run: npm run check:previews
      - name: Upload render report and sample previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geometry-previews
          path: |
            previews/render-report.json
            previews/og-full-*.png
            previews/og-quadrant-*.png
            previews/x-portrait-full-*.png
          if-no-files-found: warn
          retention-days: 14

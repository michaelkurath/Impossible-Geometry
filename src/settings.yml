---
strategy: static
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
refresh_interval_floor: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 499458
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About Impossible Geometry
  field_type: author_bio
  category: art
  description: Seven geometric illusions with bold black, white and hatched faces. Embedded vector artwork; no external API or image hosting required.
- keyname: rotation
  name: Artwork rotation
  field_type: select
  options:
  - Daily: daily
  - Every hour: hourly
  - Fixed artwork: fixed
  default: daily
  description: Daily follows your time zone. Hourly advances in UTC-aligned hours. All users in the same time slot see the same artwork.
- keyname: artwork
  name: Fixed artwork
  field_type: select
  options:
  - Penrose Triangle: penrose-triangle
  - Impossible Cube: impossible-cube
  - Impossible Trident: impossible-trident
  - Reversible Cubes: reversible-cubes
  - Kanizsa Triangle: kanizsa-triangle
  - Necker Cube: necker-cube
  - Reversible Steps: reversible-steps
  default: penrose-triangle
  optional: true
  description: Used when Artwork rotation is Fixed artwork.
- keyname: time_zone
  name: Daily rotation time zone
  field_type: time_zone
  default: Europe/Zurich
  optional: true
  description: Artwork changes at local midnight on the next refresh.
- keyname: show_explanation
  name: Show explanation
  field_type: select
  options:
  - 'Yes': 'yes'
  - 'No': 'no'
  default: 'no'
  description: Adds a short caption in full and half-vertical layouts.
- keyname: language
  name: Language
  field_type: select
  options:
  - English: en
  - Deutsch: de
  default: en
name: Impossible Geometry
description: Optical illusions for e-paper.
refresh_interval: 60

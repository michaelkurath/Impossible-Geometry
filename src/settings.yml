---
strategy: static
no_screen_padding: 'no'
dark_mode: 'no'
static_data: "{}"
polling_verb: get
framework_version: 3.3.1
serverless_language: node
refresh_interval_floor: ''
polling_url: ''
polling_headers: ''
polling_body: ''
id: 499458
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About Impossible Geometry
  field_type: author_bio
  category: art,education
  description: Six original geometric drawings exploring impossible objects, reversible depth, and figure-ground perception. No external API or hosted images required.
- keyname: rotation
  name: Artwork rotation
  field_type: select
  options:
  - Daily: daily
  - Random each refresh: random
  - Fixed artwork: fixed
  default: daily
  description: Daily cycles through the collection. Random shows every artwork before repeating.
- keyname: artwork
  name: Fixed artwork
  field_type: select
  options:
  - Closed Circuit: tribar
  - Four Corners: square
  - Which Way Up: cubes
  - Over Under Over: weave
  - Positive Negative: tessellation
  - Double Ascent: stairs
  default: tribar
  description: Used only when rotation is Fixed artwork.
  optional: true
- keyname: show_explanation
  name: Show explanation
  field_type: select
  options:
  - 'Yes': 'yes'
  - 'No': 'no'
  default: 'yes'
  description: Adds a short viewing prompt in full and half-vertical layouts.
- keyname: language
  name: Language
  field_type: select
  options:
  - English: en
  - Deutsch: de
  default: en
- keyname: time_zone
  name: Daily rotation time zone
  field_type: time_zone
  default: Europe/Zurich
  optional: true
  description: Daily artwork changes after midnight in this time zone, on the next scheduled refresh.
name: Impossible Geometry
description: Optical illusions for e-paper.
refresh_interval: 60
